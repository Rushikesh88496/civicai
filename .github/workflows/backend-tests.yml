name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicagent
          POSTGRES_USER: civicagent
          POSTGRES_PASSWORD: civicagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicagent -d civicagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://civicagent:civicagent@localhost:5432/civicagent
      # CI stamp; conftest.py also disables rate limiting and Redis.
      JWT_SECRET: ci-only-test-secret-0123456789abcdef0123456789abcdef
      RATE_LIMIT_ENABLED: "false"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed demo data
        run: python seed.py
      - name: Run tests
        run: pytest -q