[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicagent-backend"
version = "0.1.0"
description = "CivicAgent - Autonomous Civic Governance Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "groq>=0.4.0",
    "geoalchemy2>=0.14.0",
    "pgvector>=0.2.5",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "Pillow>=10.0.0",
    "langgraph>=1.2.0",
    "fastembed>=0.3.0",
    # Predictive civic hotspots (Part 23) — XGBoost pipeline + dataset tooling.
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.1.0",
    "joblib>=1.3.0",
    # Secure at-rest handling of secret configuration overrides (Part 27).
    "cryptography>=42.0.0",
    # Rate limiting for API endpoints (Part 28 — Security).
    "slowapi>=0.1.9",
    # Structured (JSON) logging for production uvicorn (Part 29 — Infra).
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = []
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Alembic autogenerated migrations are intentionally not re-wrapped.
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP006", "UP007", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]