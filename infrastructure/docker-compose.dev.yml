# ===========================================================================
# CivicAgent — development overrides.
#
#   cd infrastructure
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Adds: source mounts + hot reload, DEBUG on, demo seed, dev-only JWT secret
# defaults, healthchecks relaxed.
# ===========================================================================

services:
  postgres:
    # Publish on host 5433 by default to avoid colliding with a local
    # PostgreSQL on 5432 (matches this repo's local convention).
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  backend:
    build:
      target: runner
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
      SEED_DEMO_DATA: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Bind source over the installed copy for code reload.
      - ../backend:/app
      - uploads_data:/app/uploads
    healthcheck:
      disable: true

  frontend:
    command: ["npm", "run", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/package.json:/app/package.json
      - ../frontend/package-lock.json:/app/package-lock.json
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/next-env.d.ts:/app/next-env.d.ts
      - ../frontend/next.config.ts:/app/next.config.ts
      - ../frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ../frontend/eslint.config.mjs:/app/eslint.config.mjs
      - ../frontend/vitest.config.ts:/app/vitest.config.ts
    healthcheck:
      disable: true