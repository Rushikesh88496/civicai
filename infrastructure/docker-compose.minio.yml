# ===========================================================================
# CivicAgent — OPTIONAL MinIO/S3-compatible object storage.
#
# Only needed when STORAGE_BACKEND=s3. Bring it up alongside the main stack:
#
#   cd infrastructure
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build
#
# then set in your env file:
#   STORAGE_BACKEND=s3
#   S3_ENDPOINT_URL=http://minio:9000
#   S3_ACCESS_KEY=<MINIO_ROOT_USER>
#   S3_SECRET_KEY=<MINIO_ROOT_PASSWORD>
#   S3_BUCKET=civicagent-uploads        # alias kept for STORAGE_BUCKET
#   S3_PUBLIC_BASE_URL=http://localhost:9000/civicagent-uploads
#   S3_REGION=us-east-1
#   S3_SECURE=false
#
# See backend/.env.example for the full S3_* reference.
# ===========================================================================

services:
  minio:
    image: minio/minio:latest
    container_name: civicagent-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: us-east-1
      S3_SECURE: "false"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/civicagent-uploads}
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data: